<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f4efe3">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<title>Hospital: log your shipment</title>
<style>
  html{background:#f4efe3;min-height:100%}
  body{font-family:system-ui,sans-serif;margin:0 auto;padding:16px 16px 60px;background:#f4efe3;color:#222;min-height:100vh;max-width:520px}
  h1{font-size:20px;margin:0 0 8px}
  h3{margin:20px 0 6px;font-size:16px}
  label{display:block;margin:12px 0 4px;font-size:14px;color:#555}
  select,input,button{width:100%;box-sizing:border-box;font-size:18px;padding:12px;border-radius:8px;border:1px solid #999}
  button{background:#4a7c1f;color:#fff;border:0;margin-top:16px}
  button:disabled{opacity:.5;cursor:not-allowed}
  button.sec{background:#fff;color:#a33;border:1px solid #a33;margin-top:10px;font-size:15px}
  #chips button{width:auto;margin:8px 8px 0 0;padding:8px 12px;font-size:15px;background:#fff;color:#2d5a0a;border:1px solid #4a7c1f}
  .card{background:#fff;border-radius:8px;padding:10px;margin:8px 0}
  .card.rec{border-left:6px solid #ddd}
  .card.off{opacity:.5;text-decoration:line-through}
  .bar{height:8px;background:#ddd;border-radius:4px;overflow:hidden;margin-top:6px}
  .bar i{display:block;height:100%;background:#4a7c1f}
  .small{font-size:13px;color:#666;margin-top:4px}
  #msg{margin-top:12px;font-weight:bold}
  #link a{display:block;margin-top:8px;padding:12px;background:#fff;border:1px solid #4a7c1f;border-radius:8px;color:#2d5a0a;text-align:center;font-size:16px;text-decoration:none}
</style>
</head>
<body>
<h1>Log your hospital shipment</h1>
<div id="status" class="small" style="color:#a33"></div>

<div id="tokenBox" hidden>
  <label>Alliance secret code</label>
  <input id="token" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
  <div id="tokMsg" class="small" style="color:#a33"></div>
  <button id="tokenSave">Save code</button>
</div>

<div id="main" hidden>
  <label>Your nickname</label>
  <select id="player"></select>

  <label>Recipient (request)</label>
  <select id="recipient"></select>
  <div id="info" class="small"></div>
  <div id="link"></div>

  <label>Amount (all resources combined, same as “Total” in the game)</label>
  <input id="total" type="text" inputmode="numeric" enterkeyhint="send" placeholder="e.g. 333 000">
  <div id="chips"></div>

  <button id="send" disabled>Save shipment</button>
  <div id="msg"></div>

  <h3>Last 5 entries (everyone)</h3>
  <div id="recent"></div>
  <button class="sec" id="undo">Undo my last entry</button>

  <h3>Requests</h3>
  <div id="reqs"></div>
</div>

<script>
window.addEventListener('error', e => {
  const s = document.getElementById('status');
  if (s) s.textContent = 'Script error: ' + e.message;
});

const API = 'https://script.google.com/macros/s/AKfycbxllR_kHm99Df_xNA0PMz5kkVBiqzEjbrlsrRSWIb0zO9Bi7Pmbpg-sZJb9kS0heYFQ7Q/exec';

const ERR = {
  'forbidden': 'Wrong secret code',
  'no request': 'There is no request for this recipient',
  'player not found': 'Your nickname was not found in the sheet',
  'sheet not found': 'Sheet tab not found',
  'bad amount': 'Enter a valid amount',
  'nothing to undo': 'Nothing to undo',
  'cell not found': 'Cell not found in the sheet'
};
const err = s => ERR[s] || s;

const $ = id => document.getElementById(id);
const fmt = n => Number(n).toLocaleString('en-US');
const digits = s => String(s).replace(/\D/g, '');
const spaced = s => digits(s).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');   // 1000000 -> 1 000 000
const totalNum = () => Number(digits($('total').value)) || 0;
const lsGet = k => { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
let token = lsGet('token');
let data = null;
let busy = false;
let saving = false;
let lastLoad = 0;
let lastJson = '';

function msg(t) { $('msg').textContent = t; }

// Кнопка активна только когда выбраны ник, заявка и введена сумма
function updateSend() {
  $('send').disabled = saving || !($('player').value && $('recipient').value && totalNum() > 0);
}

// Формат суммы при вводе: 1 000 000 (курсор не прыгает)
function fmtTotal() {
  const el = $('total');
  const pos = el.selectionStart == null ? el.value.length : el.selectionStart;
  const before = digits(el.value.slice(0, pos)).length;
  const f = spaced(digits(el.value).slice(0, 12));
  el.value = f;
  let p = 0, cnt = 0;
  while (p < f.length && cnt < before) { if (f[p] !== ' ') cnt++; p++; }
  try { el.setSelectionRange(p, p); } catch (e) {}
  updateSend();
}

// Черновик: выбранный получатель и сумма (хранится 30 минут)
function saveDraft() {
  lsSet('draft', JSON.stringify({ r: $('recipient').value, t: $('total').value, ts: Date.now() }));
}
function loadDraft() {
  try {
    const d = JSON.parse(lsGet('draft') || 'null');
    if (d && Date.now() - d.ts < 30 * 60 * 1000) return d;
  } catch (e) {}
  return null;
}

// Последние суммы с этого устройства: быстрые кнопки под полем суммы
const getAmts = () => { try { return JSON.parse(lsGet('amts') || '[]'); } catch (e) { return []; } };
function pushAmt(t) {
  const a = [t].concat(getAmts().filter(x => x !== t)).slice(0, 4);
  lsSet('amts', JSON.stringify(a));
}
function showChips() {
  const box = $('chips');
  if (!box) return;
  box.innerHTML = '';
  getAmts().forEach(a => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = spaced(a);
    b.onclick = () => { $('total').value = spaced(a); saveDraft(); updateSend(); };
    box.appendChild(b);
  });
}

// Фоновое обновление не трогаем, пока вы выбираете в списке или вводите сумму
function canRefresh() {
  const tag = document.activeElement && document.activeElement.tagName;
  return !(tag === 'SELECT' || tag === 'INPUT');
}

async function api(body) {
  const r = await fetch(API, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(body)
  });
  const text = await r.text();
  try { return JSON.parse(text); }
  catch (e) { throw new Error('server returned no data: ' + text.slice(0, 80)); }
}

function askToken(text) {
  token = ''; lsSet('token', ''); lsSet('formCache', ''); lastJson = '';
  $('tokMsg').textContent = text || '';
  $('tokenBox').hidden = false;
  $('main').hidden = true;
}

function fillSelect(sel, items, cur, placeholder) {
  sel.innerHTML = '';
  sel.add(new Option(placeholder, ''));
  items.forEach(it => sel.add(new Option(it.label, it.value)));
  sel.value = cur;
}

// silent = фоновое обновление без надписи «Loading…»
function load(silent) {
  if (!token) return askToken('');
  if (busy) return;
  busy = true;
  $('tokenBox').hidden = true;
  $('main').hidden = false;
  if (!silent) $('status').textContent = data ? 'Updating…' : 'Loading…';
  api({ action: 'data', token })
    .then(d => {
      $('status').textContent = '';
      lastLoad = Date.now();
      if (d.error) return render(d);
      const s = JSON.stringify(d);
      if (s !== lastJson) {          // перерисовываем, только если данные изменились
        lastJson = s;
        lsSet('formCache', s);
        render(d);
      }
    })
    .catch(e => { if (!silent) $('status').textContent = 'Error: ' + e.message; })
    .finally(() => { busy = false; });
}

function render(d) {
  if (d.error) return askToken('Wrong secret code (server version ' + d.ver + ')');
  data = d;
  const draft = loadDraft();
  const curP = $('player').value || lsGet('player');
  const curR = $('recipient').value || (draft && draft.r) || '';
  fillSelect($('player'), d.players.map(n => ({ label: n, value: n })), curP, '— select nickname —');
  fillSelect($('recipient'),
    d.requests.map(r => ({ label: r.name + ' (remaining ' + fmt(Math.max(r.need - r.got, 0)) + ')', value: r.name })),
    curR, '— select request —');
  showInfo();
  showChips();

  // цвета заявок: имя -> цвет заливки из таблицы
  const colors = {};
  d.requests.forEach(r => { if (r.color) colors[r.name.trim().toLowerCase()] = r.color; });

  // последние записи: боковая полоска в цвет получателя
  const rc = $('recent'); rc.innerHTML = '';
  if (!d.recent.length) rc.innerHTML = '<div class="small">No entries yet</div>';
  d.recent.forEach(r => {
    const div = document.createElement('div');
    div.className = 'card rec' + (r.cancelled ? ' off' : '');
    div.textContent = r.time + ' · ' + r.player + ' → ' + r.to + ': ' + fmt(r.total) +
      (r.cancelled ? ' (cancelled)' : '');
    const col = colors[r.to.trim().toLowerCase()];
    if (col) div.style.borderLeftColor = col;
    rc.appendChild(div);
  });

  // заявки: полоска прогресса в цвет ячейки
  const rq = $('reqs'); rq.innerHTML = '';
  d.requests.forEach(r => {
    const div = document.createElement('div');
    div.className = 'card';
    const pct = r.need ? Math.min(100, Math.round(r.got / r.need * 100)) : 0;
    div.textContent = r.name + ': ' + fmt(r.got) + ' of ' + fmt(r.need);
    const bar = document.createElement('div'); bar.className = 'bar';
    const i = document.createElement('i'); i.style.width = pct + '%';
    if (r.color) {
      i.style.background = r.color;
      i.style.boxShadow = 'inset 0 0 0 1px rgba(0,0,0,.2)';
    }
    bar.appendChild(i); div.appendChild(bar);
    rq.appendChild(div);
  });

  updateSend();
}

function showInfo() {
  const name = $('recipient').value;
  const r = data && data.requests.find(x => x.name === name);
  $('info').textContent = r ? 'Collected ' + fmt(r.got) + ' of ' + fmt(r.need) +
    ', remaining ' + fmt(Math.max(r.need - r.got, 0)) : '';

  const box = $('link');
  box.innerHTML = '';
  if (r && r.link && /^https?:\/\//i.test(r.link)) {
    const a = document.createElement('a');
    a.href = r.link;
    a.target = '_blank';
    a.rel = 'noopener';
    a.textContent = 'Open send-resources page → ' + r.name;
    box.appendChild(a);
  }
}

$('tokenSave').onclick = () => {
  const t = $('token').value.replace(/[\s\u200b-\u200f\u202a-\u202e\u2066-\u2069\ufeff]/g, '');
  if (!t) return;
  token = t;
  lsSet('token', t);
  $('tokMsg').textContent = '';
  load();
};
$('player').onchange = () => { lsSet('player', $('player').value); if (data) render(data); updateSend(); };
$('recipient').onchange = () => {
  showInfo();
  saveDraft();
  updateSend();
  if ($('recipient').value) $('total').focus();   // сразу к вводу суммы
};
$('total').oninput = () => { fmtTotal(); saveDraft(); };
$('total').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); $('send').click(); }   // «Готово» на клавиатуре сохраняет
});

$('send').onclick = () => {
  const player = $('player').value, rec = $('recipient').value;
  const total = totalNum();
  if (!player || !rec || !total) return msg('Select your nickname and a request, then enter an amount');
  lsSet('player', player);
  saving = true; updateSend();
  msg('Saving…');
  api({ action: 'save', token, player, recipient: rec, total })
    .then(r => {
      saving = false;
      if (r.status === 'ok') {
        msg('Saved: +' + fmt(total) + ' → ' + rec);
        $('total').value = '';
        saveDraft();
        pushAmt(total);
        lastJson = JSON.stringify(r.data);
        lsSet('formCache', lastJson);
        lastLoad = Date.now();
        render(r.data);
      }
      else if (r.status === 'forbidden') askToken('Wrong secret code');
      else msg('Error: ' + err(r.status));
      updateSend();
    })
    .catch(e => { saving = false; updateSend(); msg('Error: ' + e.message); });
};

let armed = false;
const UNDO_TEXT = 'Undo my last entry';
$('undo').onclick = () => {
  const player = $('player').value;
  if (!player) return msg('Select your nickname first');
  if (!armed) {
    armed = true; $('undo').textContent = 'Tap again to confirm';
    setTimeout(() => { armed = false; $('undo').textContent = UNDO_TEXT; }, 4000);
    return;
  }
  armed = false; $('undo').textContent = UNDO_TEXT;
  msg('Undoing…');
  api({ action: 'undo', token, player })
    .then(r => {
      msg(r.status === 'ok' ? 'Last entry undone' : 'Error: ' + err(r.status));
      if (r.data) {
        lastJson = JSON.stringify(r.data);
        lsSet('formCache', lastJson);
        lastLoad = Date.now();
        render(r.data);
      }
    })
    .catch(e => msg('Error: ' + e.message));
};

// Фоновое обновление раз в минуту
setInterval(() => {
  if (document.hidden || !token || !canRefresh()) return;
  load(true);
}, 60000);

// Вернулись на вкладку: обновляем данные (если старше 2 минут) и ставим курсор в поле суммы
document.addEventListener('visibilitychange', () => {
  if (document.hidden || !token) return;
  if (canRefresh() && Date.now() - lastLoad > 120000) load(true);
  if ($('recipient').value && !$('total').value && !$('main').hidden) $('total').focus();
});

// Сразу показываем данные прошлого визита и черновик, свежие подгружаются фоном
showChips();
if (token) {
  try {
    const cached = lsGet('formCache');
    const dr = loadDraft();
    if (dr) $('total').value = spaced(dr.t || '');
    if (cached) {
      lastJson = cached;
      $('tokenBox').hidden = true;
      $('main').hidden = false;
      render(JSON.parse(cached));
    }
  } catch (e) {}
}
updateSend();
load();
</script>
</body>
</html>
